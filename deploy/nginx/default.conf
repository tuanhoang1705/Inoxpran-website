server {
  listen 443 ssl;
  http2 on;
  server_name inoxpran.com;

  ssl_certificate     /etc/letsencrypt/live/inoxpran.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/inoxpran.com/privkey.pem;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Block legacy query-based URLs from an old site structure.
  if ($request_uri ~* "^/(dqjs|zzzs|hyzx|qydt)(/|\\?|$)") {
    return 410;
  }
  if ($request_uri ~* "^/cdn-cgi/l/email-protection(?:\\?|$)") {
    return 410;
  }
  if ($args ~* "^(new|news|wmsg|qywh|dangqun)/") {
    return 410;
  }
  # Legacy URLs that use query strings without key=value pairs (e.g. ?new/xxx or ?rlzy1/).
  # Allow SvelteKit action URLs that start with "?/".
  if ($args ~* "^[^=/][^=]*$") {
    return 410;
  }
  if ($args ~* "\\.cshtml($|&)") {
    return 410;
  }

  client_max_body_size 50m;
  proxy_buffer_size 256k;
  proxy_buffers 8 256k;
  proxy_busy_buffers_size 512k;

  location ~ ^/admin(?:/(.*))?$ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 308 https://admin.inoxpran.com/$1$is_args$args;
  }

  location ~ ^/(openclaw|hooks|api/openclaw|\.well-known/openclaw)(/|$) {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 410;
  }

  location /v1/api/ {
    proxy_pass http://backend:3056/v1/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /favicon.ico {
    proxy_pass http://frontend:4173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
  }

  location = /site.webmanifest {
    proxy_pass http://frontend:4173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
  }

  location ^~ /icons/ {
    proxy_pass http://frontend:4173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
  }

  location ~* ^/(images/|vendor/) {
    proxy_pass http://frontend:4173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
  }

  location / {
    proxy_pass http://frontend:4173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name admin.inoxpran.com;

  ssl_certificate     /etc/letsencrypt/live/inoxpran.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/inoxpran.com/privkey.pem;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  client_max_body_size 50m;
  proxy_buffer_size 256k;
  proxy_buffers 8 256k;
  proxy_busy_buffers_size 512k;

  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location = /sitemap.xml {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 404;
  }

  location = /openclaw-dashboard {
    if ($http_upgrade = "") {
      return 308 https://admin.inoxpran.com/openclaw-dashboard/;
    }
    proxy_pass http://app_openclaw:18789;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  location ^~ /openclaw-dashboard/ {
    error_page 418 = /_openclaw_authenticated_asset;
    if ($http_upgrade = "") {
      return 418;
    }
    proxy_pass http://app_openclaw:18789;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  location = /_openclaw_authenticated_asset {
    internal;
    proxy_pass http://frontend:4173/internal/openclaw-dashboard-bootstrap;
    proxy_http_version 1.1;
    proxy_set_header Host frontend;
    proxy_set_header Accept "*/*";
    proxy_set_header X-OpenClaw-Bootstrap nginx-openclaw-bootstrap-v1;
    proxy_set_header X-OpenClaw-Path $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  location ~ ^/admin(?:/(.*))?$ {
    return 308 https://admin.inoxpran.com/$1$is_args$args;
  }

  location = /favicon.ico {
    proxy_pass http://frontend:4173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  location = /site.webmanifest {
    proxy_pass http://frontend:4173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  location ^~ /_app/ {
    proxy_pass http://frontend:4173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  location ^~ /icons/ {
    proxy_pass http://frontend:4173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  location ~* ^/(images/|vendor/) {
    proxy_pass http://frontend:4173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  location = / {
    proxy_pass http://frontend:4173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://frontend:4173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name seo-agent.inoxpran.com;

  # Certificate must be reissued to include seo-agent.inoxpran.com before enabling this block in production.
  ssl_certificate     /etc/letsencrypt/live/inoxpran.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/inoxpran.com/privkey.pem;

  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /hooks/ {
    proxy_pass http://app_openclaw:18789/hooks/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /dashboard/ {
    return 403;
  }

  location / {
    return 403;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name 9router.inoxpran.com;

  ssl_certificate     /etc/letsencrypt/live/9router.inoxpran.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/9router.inoxpran.com/privkey.pem;

  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  client_max_body_size 20m;
  proxy_buffer_size 128k;
  proxy_buffers 8 128k;
  proxy_busy_buffers_size 256k;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location = /sitemap.xml {
    return 404;
  }

  location / {
    # Two independent locks, because either alone is bypassable.
    #
    # First, only Cloudflare may open the connection. The header check below
    # proves nothing on its own: nginx cannot verify the JWT signature, so
    # anyone who dials this server's IP directly can forge the header and walk
    # straight in. The origin address is discoverable, so that is a real path,
    # not a theoretical one. Deliberately no realip directives here — the access
    # module must see the true peer, not the restored end-user address.
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    deny all;

    # Second, the request must have passed the Access policy. Cloudflare stamps
    # this header on what it forwards, so its absence means the request reached
    # Cloudflare but never satisfied Access.
    if ($http_cf_access_jwt_assertion = "") {
      return 403;
    }

    proxy_pass http://nine-router:20128;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }
}
