# Internal Telegram API relay.
#
# Why this exists: outbound TLS connections from Node.js (undici/fetch) to
# api.telegram.org are dropped by ISP-level DPI (TLS fingerprint filtering),
# while OpenSSL-based clients (curl, python, nginx) pass. This nginx instance
# terminates the backend's plain-HTTP request on the internal Docker network
# and re-originates a fresh TLS connection to api.telegram.org, which passes
# the DPI. No port is published to the host; only containers on `appnet`
# can reach this relay. Bot tokens stay inside the Docker network.
server {
    listen 8081;

    # Docker embedded DNS.
    resolver 127.0.0.11 valid=300s ipv6=off;

    location / {
        set $telegram_upstream https://api.telegram.org;
        proxy_pass $telegram_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host api.telegram.org;
        proxy_set_header Connection "";

        proxy_ssl_server_name on;
        proxy_ssl_name api.telegram.org;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        # getUpdates long-polling can hold up to ~35s.
        proxy_read_timeout 65s;
        proxy_buffering off;
        client_max_body_size 20m;
    }
}
