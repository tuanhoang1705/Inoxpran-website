services:
  redis:
    image: redis:7-alpine
    container_name: app_redis
    restart: unless-stopped
    networks:
      - appnet

  backend:
    build: ./backend
    container_name: app_backend
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3056
      MONGODB_URI: ${MONGODB_URI}
      APP_BASE_URL: ${APP_BASE_URL}
      SEO_AGENT_ENABLED: ${SEO_AGENT_ENABLED:-false}
      SEO_AGENT_AUTO_PUBLISH: ${SEO_AGENT_AUTO_PUBLISH:-false}
      OPENCLAW_BLOG_CRON_ENABLED: ${OPENCLAW_BLOG_CRON_ENABLED:-false}
      OPENCLAW_BLOG_CRON_POLL_MS: ${OPENCLAW_BLOG_CRON_POLL_MS:-30000}
      CONTENT_OPERATIONS_ENABLED: ${CONTENT_OPERATIONS_ENABLED:-false}
      CONTENT_OPERATIONS_TIMEZONE: ${CONTENT_OPERATIONS_TIMEZONE:-Asia/Ho_Chi_Minh}
      CONTENT_OPERATIONS_CRON_ENABLED: ${CONTENT_OPERATIONS_CRON_ENABLED:-false}
      CONTENT_OPERATIONS_DAILY_TIME: ${CONTENT_OPERATIONS_DAILY_TIME:-06:30}
      CONTENT_OPERATIONS_SNAPSHOT_TTL_HOURS: ${CONTENT_OPERATIONS_SNAPSHOT_TTL_HOURS:-24}
      CONTENT_OPERATIONS_MAX_ACTIONS_PER_DAY: ${CONTENT_OPERATIONS_MAX_ACTIONS_PER_DAY:-1}
      CONTENT_OPERATIONS_MIN_OPPORTUNITY_SCORE: ${CONTENT_OPERATIONS_MIN_OPPORTUNITY_SCORE:-0.65}
      CONTENT_OPERATIONS_MIN_USER_VALUE_SCORE: ${CONTENT_OPERATIONS_MIN_USER_VALUE_SCORE:-0.20}
      CONTENT_OPERATIONS_ALLOW_SKIP: ${CONTENT_OPERATIONS_ALLOW_SKIP:-true}
      CONTENT_INVENTORY_ENABLED: ${CONTENT_INVENTORY_ENABLED:-true}
      CONTENT_INVENTORY_SNAPSHOT_TTL_HOURS: ${CONTENT_INVENTORY_SNAPSHOT_TTL_HOURS:-24}
      CONTENT_INVENTORY_STALE_DAYS: ${CONTENT_INVENTORY_STALE_DAYS:-180}
      CONTENT_INVENTORY_REVIEW_DAYS: ${CONTENT_INVENTORY_REVIEW_DAYS:-90}
      CONTENT_SIGNALS_ENABLED: ${CONTENT_SIGNALS_ENABLED:-true}
      CONTENT_SIGNAL_DEFAULT_TTL_DAYS: ${CONTENT_SIGNAL_DEFAULT_TTL_DAYS:-90}
      CONTENT_SIGNAL_MAX_LENGTH: ${CONTENT_SIGNAL_MAX_LENGTH:-2000}
      CONTENT_PERFORMANCE_MONITORING_ENABLED: ${CONTENT_PERFORMANCE_MONITORING_ENABLED:-false}
      CONTENT_MONITOR_WINDOWS: ${CONTENT_MONITOR_WINDOWS:-1d,7d,14d,30d,90d}
      CONTENT_LEARNING_ENABLED: ${CONTENT_LEARNING_ENABLED:-false}
      CONTENT_LEARNING_MIN_AGE_DAYS: ${CONTENT_LEARNING_MIN_AGE_DAYS:-14}
      CONTENT_LEARNING_MIN_IMPRESSIONS: ${CONTENT_LEARNING_MIN_IMPRESSIONS:-100}
      CONTENT_LEARNING_AUTO_APPLY: ${CONTENT_LEARNING_AUTO_APPLY:-false}
      SEARCH_CONSOLE_ENABLED: ${SEARCH_CONSOLE_ENABLED:-false}
      SEARCH_CONSOLE_PROPERTY: ${SEARCH_CONSOLE_PROPERTY:-}
      SEARCH_CONSOLE_LOOKBACK_DAYS: ${SEARCH_CONSOLE_LOOKBACK_DAYS:-90}
      CONTENT_ANALYTICS_ENABLED: ${CONTENT_ANALYTICS_ENABLED:-false}
      CONTENT_ANALYTICS_PROPERTY_ID: ${CONTENT_ANALYTICS_PROPERTY_ID:-}
      CONTENT_TRENDS_ENABLED: ${CONTENT_TRENDS_ENABLED:-false}
      CONTENT_TRENDS_PROVIDER: ${CONTENT_TRENDS_PROVIDER:-disabled}
      CONTENT_PUBLISH_READINESS_ENABLED: ${CONTENT_PUBLISH_READINESS_ENABLED:-true}
      CONTENT_POST_PUBLISH_VERIFY_ENABLED: ${CONTENT_POST_PUBLISH_VERIFY_ENABLED:-true}
      OPENCLAW_IMAGE_PIPELINE_ENABLED: ${OPENCLAW_IMAGE_PIPELINE_ENABLED:-false}
      CONTENT_ACTION_WEIGHT_USER_DEMAND: ${CONTENT_ACTION_WEIGHT_USER_DEMAND:-0.20}
      CONTENT_ACTION_WEIGHT_CONTENT_GAP: ${CONTENT_ACTION_WEIGHT_CONTENT_GAP:-0.15}
      CONTENT_ACTION_WEIGHT_PERFORMANCE: ${CONTENT_ACTION_WEIGHT_PERFORMANCE:-0.15}
      CONTENT_ACTION_WEIGHT_BUSINESS: ${CONTENT_ACTION_WEIGHT_BUSINESS:-0.15}
      CONTENT_ACTION_WEIGHT_FRESHNESS: ${CONTENT_ACTION_WEIGHT_FRESHNESS:-0.10}
      CONTENT_ACTION_WEIGHT_CUSTOMER_SIGNAL: ${CONTENT_ACTION_WEIGHT_CUSTOMER_SIGNAL:-0.10}
      CONTENT_ACTION_WEIGHT_PRODUCT_CAMPAIGN: ${CONTENT_ACTION_WEIGHT_PRODUCT_CAMPAIGN:-0.05}
      CONTENT_ACTION_WEIGHT_EVIDENCE: ${CONTENT_ACTION_WEIGHT_EVIDENCE:-0.05}
      CONTENT_ACTION_WEIGHT_INTERNAL_LINK: ${CONTENT_ACTION_WEIGHT_INTERNAL_LINK:-0.05}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      OPENCLAW_DEPLOYMENT_MODE: docker
      OPENCLAW_GATEWAY_HTTP_URL: http://app_openclaw:18789
      OPENCLAW_UPDATE_ENABLED: ${OPENCLAW_UPDATE_ENABLED:-false}
      OPENCLAW_UPDATE_RUNTIME_DIR: /openclaw-update-runtime
      OPENCLAW_ASSET_ROOT: /openclaw-assets
      OPENCLAW_DASHBOARD_URL: ${OPENCLAW_DASHBOARD_URL:-https://admin.inoxpran.com/openclaw-dashboard/}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-http://telegram-relay:8081}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_NOTIFY_CHAT_IDS: ${TELEGRAM_NOTIFY_CHAT_IDS:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_APPROVAL_TTL_HOURS: ${TELEGRAM_APPROVAL_TTL_HOURS:-72}
    volumes:
      - ./deploy/openclaw/agents:/openclaw-assets/agents:ro
      - ./deploy/openclaw/skills:/openclaw-assets/skills:ro
      - ./deploy/openclaw/prompts:/openclaw-assets/prompts:ro
      - ./deploy/openclaw/openclaw.json5:/openclaw-assets/openclaw.json5:ro
      - ./deploy/openclaw/SKILL_INSTALL_REPORT.md:/openclaw-assets/SKILL_INSTALL_REPORT.md:ro
      - ./deploy/openclaw/update-runtime:/openclaw-update-runtime
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:-./backend/credentials/file.json}:/run/secrets/firebase-service-account.json:ro
    restart: unless-stopped
    networks:
      - appnet

  telegram-relay:
    image: nginx:alpine
    container_name: app_telegram_relay
    volumes:
      - ./deploy/telegram-relay/relay.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - appnet

  n8n:
    image: n8nio/n8n:2.12.2
    container_name: app_n8n
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      N8N_PORT: 5678
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-this-in-env}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
      NODE_FUNCTION_ALLOW_BUILTIN: ${NODE_FUNCTION_ALLOW_BUILTIN:-http,https,url}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Ho_Chi_Minh}
      BACKEND_API_BASE_URL: ${BACKEND_API_BASE_URL:-http://backend:3056/v1/api}
    volumes:
      - ./deploy/n8n/data:/home/node/.n8n
      - ./deploy/n8n/workflows:/workflows:ro
    restart: unless-stopped
    networks:
      - appnet

  openclaw:
    # TODO: Verify the official OpenClaw deployment image on the VPS. Replace this if the
    # OpenClaw docs specify a different image.
    image: openclaw/openclaw:latest
    container_name: app_openclaw
    command:
      - openclaw
      - gateway
      - run
      - --allow-unconfigured
      - --auth
      - token
      - --bind
      - lan
      - --port
      - "18789"
      - --ws-log
      - compact
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      OPENCLAW_STATE_DIR: /data
      OPENCLAW_CONFIG_PATH: /data/openclaw.json5
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_NO_AUTO_UPDATE: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      INOXPRAN_BACKEND_API_BASE: http://backend:3056/v1/api
      INOXPRAN_PUBLIC_SITE_URL: https://inoxpran.com
      INOXPRAN_SEO_AGENT_AUTO_PUBLISH: ${SEO_AGENT_AUTO_PUBLISH:-false}
      INOXPRAN_SEO_AGENT_API_KEY: ${SEO_AGENT_API_KEY:-}
      INOXPRAN_SEO_AGENT_HMAC_SECRET: ${SEO_AGENT_HMAC_SECRET:-}
      API_KEY: ${API_KEY}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
    volumes:
      - ./deploy/openclaw/openclaw.json5:/data/openclaw.json5:ro
      - ./deploy/openclaw/data:/data
      - ./deploy/openclaw/workspaces:/workspaces
      - ./deploy/openclaw/skills:/workspaces/shared-skills:ro
      - ./deploy/openclaw/prompts:/workspaces/prompts:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:18789/healthz').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - appnet
    depends_on:
      - backend
      - redis

  openclaw-updater:
    profiles:
      - vps
    build: ./deploy/openclaw/updater
    image: inoxpran/openclaw-updater:local
    container_name: app_openclaw_updater
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:-991}"
    environment:
      OPENCLAW_PROJECT_ROOT: ${OPENCLAW_HOST_PROJECT_PATH:-/workspace}
      OPENCLAW_UPDATE_RUNTIME_DIR: ${OPENCLAW_HOST_PROJECT_PATH:-/workspace}/deploy/openclaw/update-runtime
      OPENCLAW_UPDATE_BACKUP_DIR: ${OPENCLAW_HOST_PROJECT_PATH:-/workspace}/deploy/openclaw/update-backups
      OPENCLAW_UPDATE_IMAGE: openclaw/openclaw:latest
      OPENCLAW_UPDATE_POLL_MS: 2000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPENCLAW_HOST_PROJECT_PATH:-.}:${OPENCLAW_HOST_PROJECT_PATH:-/workspace}:ro
      - ./deploy/openclaw/update-runtime:${OPENCLAW_HOST_PROJECT_PATH:-/workspace}/deploy/openclaw/update-runtime:rw
      - ./deploy/openclaw/update-backups:${OPENCLAW_HOST_PROJECT_PATH:-/workspace}/deploy/openclaw/update-backups:rw
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      - openclaw

  frontend:
    build: ./frontend
    container_name: app_frontend
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4173
      API_BASE_URL: ${API_BASE_URL:-http://backend:3056/v1/api}
      API_KEY: ${API_KEY}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-50M}
    restart: unless-stopped
    networks:
      - appnet
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    container_name: app_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/auth:/etc/nginx/auth:ro
      - ./deploy/nginx/ssl:/etc/letsencrypt
      - ./deploy/nginx/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
      - openclaw
    restart: unless-stopped
    networks:
      - appnet

  certbot:
    image: certbot/certbot
    container_name: app_certbot
    volumes:
      - ./deploy/nginx/ssl:/etc/letsencrypt
      - ./deploy/nginx/www:/var/www/certbot
    entrypoint: >-
      sh -c "trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --webroot -w /var/www/certbot; done"
    restart: unless-stopped
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
